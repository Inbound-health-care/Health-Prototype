name: CI

# Gate every push and PR on the test suite. Pure stdlib — no install step.
# push runs only on main (post-merge); PR branches are covered by pull_request,
# so each PR push triggers exactly one run instead of two.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the in-progress run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile (syntax check)
        run: python -m compileall -q recurrence.py tests data scripts
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Self-test (the six spec cases)
        run: python recurrence.py --self-test

  # Lint gate. The engine itself is stdlib-only; ruff is a dev tool, so this is
  # the one job that installs a dependency (pinned to match local). Lint only —
  # NOT `ruff format` (the project keeps hand-formatting by decision).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: pip install ruff==0.15.8
      - name: Ruff check
        run: ruff check .
