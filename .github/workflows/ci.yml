name: CI

# Gate every push and PR on the test suite. Runtime remains pure stdlib; CI
# installs only the exact dev-tool versions in requirements-dev.txt.
# push runs only on main (post-merge); PR branches are covered by pull_request,
# so each PR push triggers exactly one run instead of two.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the in-progress run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact dev tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Byte-compile every project file (delegates to the Makefile)
        run: make compile
      - name: Run test suite
        run: make test
      - name: Self-tests (engine + extractor)
        run: make selftest
      # Validate the static agent-interop surface (A2A card + MCP tool-defs) and
      # enforce the no-overclaim honesty rule against STATUS.md (ADR 0032). The
      # teeth live in tests/test_agent_card.py (run by `make test`); this is the
      # explicit named gate over the real committed files.
      - name: Agent-card honesty gate
        run: make agent-card
      # Gate the fail-closed extractor's no-bleed / consistent-shift / additivity
      # invariants AND the rule-layer metamorphic properties (record isolation,
      # reordering & shift invariance) on every PR (ADR 0025, 0027). Hypothesis is
      # a dev-only tool, installed from the versioned manifest; the run is derandomized
      # (CI=true) so any failure reproduces locally. The engine stays pure-stdlib.
      - name: Property tests (Hypothesis — extractor + rule-layer + audit-chain invariants)
        run: python -m unittest tests.test_extract_multi_properties tests.test_rule_properties tests.test_audit_properties -v

  # Lint gate. The engine itself is stdlib-only; ruff is a dev tool, so this is
  # the one job that installs a dependency (pinned to match local). Lint only —
  # NOT `ruff format` (the project keeps hand-formatting by decision).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install exact dev tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Ruff check
        run: ruff check .

  # HTML-validity gate (ADR 0026). The views are GENERATED on demand and gitignored,
  # so proof-html must build them FIRST, then validate. Self-contained output (inline
  # CSS/JS, no network, no <img>/<link>/<script src>) -> the external-link checker is
  # disabled; this validates markup + internal #anchors only. The generate step
  # delegates to the Makefile so local and CI share one file list (PR #29 parity).
  html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Generate the four HTML views into _site/ (delegates to the Makefile)
        run: make html-demos
      - name: Validate generated HTML (proof-html / html-proofer)
        uses: anishathalye/proof-html@a76b66427e600c6992e8937a741afffd2264a613 # v2.2.3
        with:
          directory: ./_site
          disable_external: true    # no external links exist; skip the network checker (no flake/egress)
          enforce_https: false      # moot once external is off; explicit so a future link can't impose https silently
          check_favicon: false      # views intentionally have no <link rel=icon>
          check_opengraph: false    # no OpenGraph meta tags
          check_html: true          # the actual gate: parse + duplicate-id + unresolved internal #anchor
