name: CI

# Gate every push and PR on the test suite. Pure stdlib — no install step.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile (syntax check)
        run: python -m compileall -q recurrence.py tests data
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Self-test (the six spec cases)
        run: python recurrence.py --self-test
