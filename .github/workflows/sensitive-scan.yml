name: Sensitive change scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sensitive-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sensitive-scan:
    name: sensitive-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Scan added lines
        run: python tools/scan_sensitive_changes.py --ci
