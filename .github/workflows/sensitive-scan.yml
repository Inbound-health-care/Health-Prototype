name: Sensitive change scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sensitive-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sensitive-scan:
    name: sensitive-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Scan added lines
        run: python tools/scan_sensitive_changes.py --ci
